name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 release assets
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag_object: ${{ steps.release.outputs.tag_object }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(grep -A5 '^\[workspace.package\]$' Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
          [[ -n "${project_version}" ]] || { echo "workspace version is missing" >&2; exit 1; }
          tag_object=
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
              echo "not a stable or RC release tag: ${tag}" >&2
              exit 1
            }
            version="${tag#v}"
            [[ "${version}" == "${project_version}" ]] || {
              echo "tag ${tag} does not match workspace version ${project_version}" >&2
              exit 1
            }
            tag_ref="refs/tags/${tag}"
            verified_tag_ref="refs/tags/${tag}.annotated"
            git fetch --force origin "${tag_ref}:${verified_tag_ref}"
            [[ "$(git cat-file -t "${verified_tag_ref}")" == "tag" ]] || {
              echo "release tag must be annotated: ${tag}" >&2
              exit 1
            }
            tag_object="$(git rev-parse --verify "${verified_tag_ref}")"
            [[ "${tag_object}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "release tag object is not a full SHA-1: ${tag_object}" >&2
              exit 1
            }
            tag_commit="$(git rev-parse --verify "${verified_tag_ref}^{commit}")"
            [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || {
              echo "tag ${tag} resolves to ${tag_commit}, expected ${GITHUB_SHA}" >&2
              exit 1
            }
          else
            version="${project_version}"
            tag="v${project_version}"
          fi
          if [[ "${version}" == *-rc.* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${GITHUB_SHA}"
            echo "prerelease=${prerelease}"
            echo "tag_object=${tag_object}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xauth \
            xvfb \
            zstd

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/tauri-gui/frontend/package-lock.json

      - name: Install Rust 1.94.1 with verification components
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Verify immutable annotated release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p xtask -- \
            release verify-remote-tag \
            --tag "${GITHUB_REF_NAME}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-tag-object "${{ steps.release.outputs.tag_object }}" >/dev/null

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2 (Node 24)

      - name: Install clean frontend dependencies
        working-directory: apps/tauri-gui/frontend
        run: npm ci

      - name: Audit frontend dependencies during manual preflight
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/tauri-gui/frontend
        run: npm audit --audit-level=high

      - name: Run release verification gate
        run: cargo run --locked -p xtask -- verify all

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Pin Tauri Linux packaging tools
        shell: bash
        run: |
          set -euo pipefail
          # immutable mirror provenance: appimage-toolchain-v1 preserves the exact
          # upstream linuxdeploy 659c9db build, Tauri plugins, and Type 2 runtime.
          cache="$HOME/.cache/tauri"
          mkdir -p "${cache}"
          fetch_verified() {
            local url="$1" destination="$2" expected="$3" temporary
            temporary="${destination}.download"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "${temporary}" "${url}"
            printf '%s  %s\n' "${expected}" "${temporary}" | sha256sum -c -
            chmod 755 "${temporary}"
            mv "${temporary}" "${destination}"
          }
          fetch_verified \
            'https://github.com/ZChenW/wallpaper-console-rust/releases/download/appimage-toolchain-v1/linuxdeploy-x86_64.AppImage' \
            "${cache}/linuxdeploy-x86_64.AppImage" \
            '20eebde3c18ae2e44279bd624fc72482503aece216d5d77f10932235342f71c1'
          fetch_verified \
            'https://github.com/ZChenW/wallpaper-console-rust/releases/download/appimage-toolchain-v1/linuxdeploy-plugin-gtk.sh' \
            "${cache}/linuxdeploy-plugin-gtk.sh" \
            'cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a'
          fetch_verified \
            'https://github.com/ZChenW/wallpaper-console-rust/releases/download/appimage-toolchain-v1/linuxdeploy-plugin-gstreamer.sh' \
            "${cache}/linuxdeploy-plugin-gstreamer.sh" \
            'c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94'
          fetch_verified \
            'https://github.com/ZChenW/wallpaper-console-rust/releases/download/appimage-toolchain-v1/linuxdeploy-plugin-appimage.AppImage' \
            "${cache}/linuxdeploy-plugin-appimage.AppImage" \
            'e0129b8070e0c7b37151027e46e9fa44fe97ea29e3692705a2c5cff3771d3121'
          fetch_verified \
            'https://github.com/ZChenW/wallpaper-console-rust/releases/download/appimage-toolchain-v1/appimage-runtime-x86_64' \
            "${cache}/appimage-runtime-x86_64" \
            '439731bfc9b4620ad11802ad5a3c22707f24f3a49de09461ec937ce6e35dd5cd'

          plugin_original="${cache}/linuxdeploy-plugin-appimage-verified.AppImage"
          plugin_root="${cache}/linuxdeploy-plugin-appimage-pinned"
          mv "${cache}/linuxdeploy-plugin-appimage.AppImage" "${plugin_original}"
          rm -rf "${plugin_root}"
          mkdir -p "${plugin_root}"
          (cd "${plugin_root}" && APPIMAGELAUNCHER_DISABLE=1 "${plugin_original}" --appimage-extract >/dev/null)
          cat > "${plugin_root}/squashfs-root/usr/bin/appimagetool" <<'PINNED_APPIMAGETOOL'
          #! /bin/bash
          set -euo pipefail
          : "${APPIMAGE_PINNED_RUNTIME:?APPIMAGE_PINNED_RUNTIME is required}"
          this_dir="$(readlink -f "$(dirname "$0")")"
          exec "$this_dir"/../../appimagetool-prefix/AppRun --runtime-file "$APPIMAGE_PINNED_RUNTIME" "$@"
          PINNED_APPIMAGETOOL
          chmod 755 "${plugin_root}/squashfs-root/usr/bin/appimagetool"
          cat > "${cache}/linuxdeploy-plugin-appimage.AppImage" <<PINNED_PLUGIN
          #!/bin/sh
          set -eu
          export APPIMAGE_PINNED_RUNTIME="${cache}/appimage-runtime-x86_64"
          exec "${plugin_root}/squashfs-root/AppRun" "\$@"
          PINNED_PLUGIN
          chmod 755 "${cache}/linuxdeploy-plugin-appimage.AppImage"

      - name: Build AppImage and CLI
        run: |
          cargo tauri build --bundles appimage --ci -- --locked
          cargo build --locked --release --package wc-cli
          target/release/wallpaper-console-rust --help >/dev/null

      - name: Prepare host-first AppImage runtime
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [[ -n "${appimage}" ]] || { echo "Tauri did not produce an AppImage" >&2; exit 1; }
          appimage="$(realpath "${appimage}")"
          repack_dir="target/appimage-repack"
          appdir="${repack_dir}/AppDir"
          runtime="$HOME/.cache/tauri/appimage-runtime-x86_64"
          candidate="${repack_dir}/candidate.AppImage"
          candidate_second="${repack_dir}/candidate-second.AppImage"
          rm -rf "${repack_dir}"
          mkdir -p "${repack_dir}/tool"
          cargo run --quiet --locked -p xtask -- \
            release verify-appimage-runtime \
            --runtime "${runtime}" \
            --appimage "${appimage}" \
            --runtime-size 944632 \
            --sha256 439731bfc9b4620ad11802ad5a3c22707f24f3a49de09461ec937ce6e35dd5cd
          (cd "${repack_dir}" && APPIMAGELAUNCHER_DISABLE=1 "${appimage}" --appimage-extract >/dev/null)
          mv "${repack_dir}/squashfs-root" "${appdir}"
          cargo run --locked -p xtask -- release prepare-appimage --appdir "${appdir}"
          source_date_epoch="$(git log -1 --format=%ct)"
          find "${appdir}" -exec touch -h -d "@${source_date_epoch}" {} +
          repacker="$HOME/.cache/tauri/linuxdeploy-plugin-appimage-verified.AppImage"
          [[ -x "${repacker}" ]] || { echo "Tauri AppImage repacker is missing" >&2; exit 1; }
          printf '%s  %s\n' \
            'e0129b8070e0c7b37151027e46e9fa44fe97ea29e3692705a2c5cff3771d3121' \
            "${repacker}" | sha256sum -c -
          (cd "${repack_dir}/tool" && APPIMAGELAUNCHER_DISABLE=1 "${repacker}" --appimage-extract >/dev/null)
          appimagetool="${repack_dir}/tool/squashfs-root/appimagetool-prefix/AppRun"
          [[ -x "${appimagetool}" ]] || { echo "Tauri appimagetool is missing" >&2; exit 1; }
          SOURCE_DATE_EPOCH="${source_date_epoch}" "${appimagetool}" --runtime-file "$(realpath "${runtime}")" "$(realpath "${appdir}")" "$(realpath -m "${candidate}")"
          SOURCE_DATE_EPOCH="${source_date_epoch}" "${appimagetool}" --runtime-file "$(realpath "${runtime}")" "$(realpath "${appdir}")" "$(realpath -m "${candidate_second}")"
          cmp "${candidate}" "${candidate_second}"
          mv "${candidate}" "${appimage}"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [[ -n "${appimage}" ]] || { echo "Tauri did not produce an AppImage" >&2; exit 1; }
          cargo run --locked -p xtask -- release package-linux \
            --version "${{ steps.release.outputs.version }}" \
            --appimage "${appimage}" \
            --cli target/release/wallpaper-console-rust \
            --out dist

      - name: Smoke-test packaged assets
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          appimage="$(realpath "dist/wallpaper-console_${{ steps.release.outputs.version }}_x86_64.AppImage")"
          rm -rf target/appimage-smoke target/cli-smoke
          mkdir -p target/appimage-smoke target/cli-smoke
          (cd target/appimage-smoke && "${appimage}" --appimage-extract >/dev/null)
          test -x target/appimage-smoke/squashfs-root/AppRun
          test -x target/appimage-smoke/squashfs-root/usr/bin/wallpaper-console-tauri
          find target/appimage-smoke/squashfs-root/usr/lib -maxdepth 1 -name 'libwebkit2gtk-4.1.so*' -print -quit | grep -q .
          test ! -e target/appimage-smoke/squashfs-root/AppRun.wrapped
          test ! -d target/appimage-smoke/squashfs-root/apprun-hooks
          readelf -d target/appimage-smoke/squashfs-root/usr/bin/wallpaper-console-tauri | grep -Fq "\$ORIGIN/../lib"
          grep -q 'LD_LIBRARY_PATH' target/appimage-smoke/squashfs-root/AppRun
          grep -q 'WCR_WEBKIT_DISABLE_DMABUF_RENDERER' target/appimage-smoke/squashfs-root/AppRun
          if grep -q 'GDK_BACKEND=' target/appimage-smoke/squashfs-root/AppRun; then
            echo "AppRun must not force a display backend" >&2
            exit 1
          fi
          rm -rf /tmp/wcr-appimage-fallback-smoke
          mkdir -p /tmp/wcr-appimage-fallback-smoke
          set +e
          timeout --kill-after=2s 10s env \
            WCR_APPIMAGE_FORCE_BUNDLED=1 \
            GDK_BACKEND=x11 \
            XDG_CONFIG_HOME=/tmp/wcr-appimage-fallback-smoke \
            xvfb-run -a target/appimage-smoke/squashfs-root/AppRun \
            >/tmp/wcr-appimage-fallback-smoke/stdout.log \
            2>/tmp/wcr-appimage-fallback-smoke/stderr.log
          fallback_status=$?
          set -e
          [[ "${fallback_status}" -eq 124 ]] || {
            cat /tmp/wcr-appimage-fallback-smoke/stderr.log >&2
            echo "bundled AppImage fallback exited unexpectedly: ${fallback_status}" >&2
            exit 1
          }
          if grep -q 'Unable to spawn a new child process' \
            /tmp/wcr-appimage-fallback-smoke/stderr.log; then
            cat /tmp/wcr-appimage-fallback-smoke/stderr.log >&2
            echo "bundled AppImage fallback could not spawn a child process" >&2
            exit 1
          fi
          gui=target/appimage-smoke/squashfs-root/usr/bin/wallpaper-console-tauri
          host_webkit="$(LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu ldd "${gui}" | awk '/libwebkit2gtk-4.1/{print $3; exit}')"
          [[ "$(readlink -f "${host_webkit}")" == /usr/lib/x86_64-linux-gnu/* ]]
          bundled_webkit="$(env -u LD_LIBRARY_PATH ldd "${gui}" | awk '/libwebkit2gtk-4.1/{print $3; exit}')"
          [[ "$(readlink -f "${bundled_webkit}")" == "$(realpath target/appimage-smoke/squashfs-root/usr/lib)/"* ]]
          find target/appimage-smoke/squashfs-root -type f -name '*.desktop' -print -quit | grep -q .
          tar --zstd -xf "dist/wallpaper-console-cli_${{ steps.release.outputs.version }}_x86_64.tar.zst" \
            -C target/cli-smoke
          "target/cli-smoke/wallpaper-console-cli_${{ steps.release.outputs.version }}_x86_64/wallpaper-console-rust" --help >/dev/null
          mkdir -p publish
          cp dist/* RELEASE_NOTES.md publish/

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: wallpaper-console-${{ steps.release.outputs.version }}-linux-x86_64
          path: publish/
          if-no-files-found: error

  publish-release:
    name: Publish verified GitHub release
    if: github.event_name == 'push'
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ needs.build-linux-x86_64.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.94.1 for provenance verification
        uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1

      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: wallpaper-console-${{ needs.build-linux-x86_64.outputs.version }}-linux-x86_64
          path: release-input

      - name: Publish assets through a verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-linux-x86_64.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-linux-x86_64.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build-linux-x86_64.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.build-linux-x86_64.outputs.prerelease }}
          RELEASE_TAG_OBJECT: ${{ needs.build-linux-x86_64.outputs.tag_object }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets="$(printf '%s\n' \
            "SHA256SUMS" \
            "wallpaper-console_${RELEASE_VERSION}_x86_64.AppImage" \
            "wallpaper-console-cli_${RELEASE_VERSION}_x86_64.tar.zst" | sort)"

          cargo run --quiet --locked -p xtask -- \
            release verify-remote-tag \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_COMMIT}" \
            --expected-tag-object "${RELEASE_TAG_OBJECT}" >/dev/null
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; preserve it for investigation" >&2
            exit 1
          fi

          release_flags=(
            --verify-tag
            --draft
            --title "Wallpaper Console ${RELEASE_TAG}"
            --notes-file release-input/RELEASE_NOTES.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            "release-input/wallpaper-console_${RELEASE_VERSION}_x86_64.AppImage" \
            "release-input/wallpaper-console-cli_${RELEASE_VERSION}_x86_64.tar.zst" \
            "release-input/SHA256SUMS" \
            "${release_flags[@]}"

          actual_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[].name] | sort | join("\n")')"
          [[ "${actual_assets}" == "${expected_assets}" ]] || {
            echo "draft release asset set does not match the contract" >&2
            diff -u <(printf '%s\n' "${expected_assets}") <(printf '%s\n' "${actual_assets}") || true
            exit 1
          }

          rm -rf target/release-download
          mkdir -p target/release-download
          gh release download "${RELEASE_TAG}" --dir target/release-download
          (cd target/release-download && sha256sum -c SHA256SUMS)
          cargo run --quiet --locked -p xtask -- \
            release verify-remote-tag \
            --tag "${RELEASE_TAG}" \
            --expected-commit "${RELEASE_COMMIT}" \
            --expected-tag-object "${RELEASE_TAG_OBJECT}" >/dev/null
          gh release edit "${RELEASE_TAG}" --draft=false
          published_release="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}")"
          if ! jq -e --argjson prerelease "${RELEASE_PRERELEASE}" '
            .draft == false and
            .prerelease == $prerelease and
            .immutable == true
          ' <<<"${published_release}" >/dev/null; then
            echo "published release state does not match the contract" >&2
            jq '{draft, prerelease, immutable}' <<<"${published_release}" >&2
            exit 1
          fi
