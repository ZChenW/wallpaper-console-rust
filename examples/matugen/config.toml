# Minimal matugen config: Wallpaper Console → waybar
#
# Install:
#   mkdir -p ~/.config/matugen
#   cp -a examples/matugen/. ~/.config/matugen/
#
# Prefer command (avoids interactive prompts):
#   matugen image "$still" -m dark --prefer darkness

[config]
version_check = false

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'
