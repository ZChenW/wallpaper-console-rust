[workspace]
resolver = "2"
members = [
    "crates/wc-core",
    "crates/wc-storage",
    "crates/wc-scan",
    "crates/wc-backend",
    "crates/wc-cli",
    "crates/wc-preview",
    "xtask",
]
exclude = [
    # Optional experiment. Tauri v2 currently requires webkit2gtk-4.1 on Linux,
    # while the Arch/Wails path uses webkitgtk-6.0.
    "apps/tauri-gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rand = "0.8"
camino = { version = "1", features = ["serde1"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
dirs = "5"

wc-core = { path = "crates/wc-core" }
wc-storage = { path = "crates/wc-storage" }
wc-scan = { path = "crates/wc-scan" }
wc-backend = { path = "crates/wc-backend" }
wc-preview = { path = "crates/wc-preview" }
