[package]
name = "wallpaper-console-tauri"
version = "0.1.0"
description = "Rust-native Wallpaper Console GUI"
authors = ["wallpaper-console"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
rusqlite.workspace = true
md5 = "0.8"
wc-core.workspace = true
wc-storage.workspace = true
wc-scan.workspace = true
wc-backend.workspace = true
wc-preview.workspace = true
