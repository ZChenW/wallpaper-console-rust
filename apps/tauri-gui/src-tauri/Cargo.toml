[package]
name = "wallpaper-console-tauri"
version = "0.1.0"
description = "Rust-native Wallpaper Console GUI"
authors = ["wallpaper-console"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
production = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite.workspace = true
wc-core.workspace = true
wc-config.workspace = true
wc-storage.workspace = true
wc-scan.workspace = true
camino.workspace = true
wc-backend.workspace = true
wc-app.workspace = true
wc-preview.workspace = true
serde_json.workspace = true
fs2.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
